name: Publish release

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to publish (for example, v2.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve and validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9] ]]; then
            echo "Release tag must start with v and a version number: $RELEASE_TAG"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out selected release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install "build>=1.2,<2" "twine>=6.2,<8"

      - name: Match tag to package version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import runpy

          from packaging.version import InvalidVersion, Version

          tag = os.environ["RELEASE_TAG"]
          tag_version = tag[1:]
          try:
              Version(tag_version)
          except InvalidVersion as error:
              raise SystemExit(f"Invalid release version in tag {tag!r}: {error}") from error

          package_version = runpy.run_path("src/systempulse/__init__.py")["__version__"]
          if package_version != tag_version:
              raise SystemExit(
                  f"Tag {tag!r} does not match package version {package_version!r}."
              )

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={package_version}\n")
          print(f"Release version: {package_version}")
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Verify built artifact versions
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib

          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          dist = pathlib.Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"Expected one wheel and one sdist, found {len(wheels)} and {len(sdists)}."
              )

          expected = Version(os.environ["EXPECTED_VERSION"])
          wheel_version = parse_wheel_filename(wheels[0].name)[1]
          sdist_version = parse_sdist_filename(sdists[0].name)[1]
          if wheel_version != expected or sdist_version != expected:
              raise SystemExit(
                  f"Artifact versions {wheel_version} and {sdist_version} do not match {expected}."
              )
          print(f"Built: {wheels[0].name}")
          print(f"Built: {sdists[0].name}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: testpypi
      url: https://test.pypi.org/p/systempulse

    permissions:
      id-token: write

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify exact TestPyPI package
    needs:
      - build
      - publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download original built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Wait for exact version on TestPyPI
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir testpypi-download
          for attempt in {1..12}; do
            if python -m pip download \
              --no-deps \
              --only-binary=:all: \
              --index-url https://test.pypi.org/simple/ \
              --dest testpypi-download \
              "systempulse==$PACKAGE_VERSION"; then
              break
            fi

            if [ "$attempt" -eq 12 ]; then
              echo "SystemPulse $PACKAGE_VERSION did not become downloadable from TestPyPI."
              exit 1
            fi

            echo "Waiting for TestPyPI propagation..."
            sleep 10
          done

      - name: Verify and install TestPyPI wheel
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          built_wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          testpypi_wheel=$(find testpypi-download -maxdepth 1 -name '*.whl' -print -quit)
          test "$(sha256sum "$built_wheel" | cut -d' ' -f1)" = \
            "$(sha256sum "$testpypi_wheel" | cut -d' ' -f1)"

          python -m pip install "$testpypi_wheel"
          test "$(python -c 'import importlib.metadata; print(importlib.metadata.version("systempulse"))')" \
            = "$PACKAGE_VERSION"
          systempulse --version
          systempulse --help
          python -m systempulse --version
          python -m pip check

      - name: Verify Prometheus extra from the same wheel
        shell: bash
        run: |
          testpypi_wheel=$(find testpypi-download -maxdepth 1 -name '*.whl' -print -quit)
          python -m pip install "${testpypi_wheel}[prometheus]"
          systempulse serve --help
          python -m pip check

  publish-pypi:
    name: Publish same distributions to PyPI
    needs:
      - build
      - verify-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: pypi
      url: https://pypi.org/p/systempulse

    permissions:
      id-token: write

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
