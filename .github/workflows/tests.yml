name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy src/systempulse
      - name: Coverage
        run: >-
          python -m pytest
          --cov=systempulse
          --cov-report=term-missing
          --cov-report=xml

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Run tests with warning hygiene
        run: python -m pytest -W error

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install packaging tools
        run: python -m pip install "build>=1.2,<2" "twine>=6.2,<8"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Smoke-test base wheel without Prometheus
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          python -m venv "$RUNNER_TEMP/systempulse-base"
          source "$RUNNER_TEMP/systempulse-base/bin/activate"
          python -m pip install "$wheel"
          python -c "import importlib.util; assert importlib.util.find_spec('prometheus_client') is None"
          systempulse --help
          systempulse --version
          systempulse snapshot
          python -m systempulse --version
          if output=$(systempulse serve 2>&1); then
            echo "Exporter unexpectedly started without its optional dependency"
            exit 1
          fi
          grep -F 'systempulse[prometheus]' <<< "$output"
      - name: Smoke-test Prometheus extra
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          python -m venv "$RUNNER_TEMP/systempulse-prometheus"
          source "$RUNNER_TEMP/systempulse-prometheus/bin/activate"
          python -m pip install "${wheel}[prometheus]"
          systempulse serve --help
          python -c "from systempulse.exporter import ExporterState, create_registry; create_registry(ExporterState())"
