[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systempulse"
dynamic = ["version"]
description = "A lightweight cross-platform terminal system monitor and observability CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Anubhav Gupta" }
]
keywords = [
  "monitoring",
  "observability",
  "system-monitor",
  "terminal",
  "cli"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring"
]
dependencies = [
  "platformdirs>=4.3,<5",
  "psutil>=7.0,<8",
  "rich>=13.9,<15"
]

[project.urls]
Homepage = "https://github.com/guptaoni891-ctrl/systempulse"
Repository = "https://github.com/guptaoni891-ctrl/systempulse"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1"
]

[project.scripts]
systempulse = "systempulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "systempulse.__version__" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
