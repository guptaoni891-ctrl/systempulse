[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systempulse"
version = "1.0.0"
description = "A Linux system monitor with CPU, memory, disk, network, temperature, process, NVIDIA GPU, and CSV logging support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Anubhav Gupta" }
]
dependencies = [
  "psutil>=7.0,<8",
  "rich>=13.9,<15"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1"
]

[project.scripts]
systempulse = "systempulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
